<!DOCTYPE html>  <html lang="en">  
<head>  
<meta charset="UTF-8">  
<title>Web Quiz Game - Hacker Edition</title>  
<style>  
@import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap');  body {
font-family: 'Roboto Mono', monospace;
margin:0; padding:0;
background:#000;
color:#0f0;
overflow:hidden;
}

#matrix {
position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1;
background:#000;
}

canvas { display:block; }

.screen {
display:none;
flex-direction:column;
justify-content:center;
align-items:center;
height:100vh;
padding:20px;
text-align:center;
transition: all 0.5s ease;
}

.loader {
border: 8px solid rgba(0,255,0,0.3);
border-top: 8px solid #0f0;
border-radius:50%;
width:60px; height:60px;
animation:spin 1s linear infinite;
margin-top:20px;
}
@keyframes spin { 0%{transform:rotate(0deg);}100%{transform:rotate(360deg);} }

button {
margin:10px;
padding:12px 25px;
font-size:18px;
cursor:pointer;
border-radius:5px;
border:none;
background: rgba(0,255,0,0.1);
color:#0f0;
transition: all 0.3s ease;
box-shadow: 0 0 5px #0f0;
}
button:hover {
background: rgba(0,255,0,0.3);
transform: scale(1.05);
box-shadow: 0 0 15px #0f0, 0 0 25px #0f0;
}

.option {
display:block;
margin:15px auto;
padding:12px 20px;
cursor:pointer;
background: rgba(0,255,0,0.1);
border-radius:5px;
width:70%;
font-size:16px;
transition: all 0.3s ease;
box-shadow: 0 0 5px #0f0;
}
.option:hover {
background: rgba(0,255,0,0.3);
transform: scale(1.03);
box-shadow: 0 0 15px #0f0, 0 0 25px #0f0;
}

#questionCard {
background: rgba(0,0,0,0.7);
padding:30px;
border-radius:12px;
box-shadow: 0 0 20px #0f0;
max-width:600px;
width:90%;
min-height:200px;
text-align:left;
}

h2,h3,p { margin:10px 0; color:#0f0; }

@keyframes typing {
from { width: 0; }
to { width: 100%; }
}

.typing {
overflow: hidden;
white-space: nowrap;
border-right: 2px solid #0f0;
animation: typing 0.5s steps(30,end) forwards;
}

#score {
font-weight:bold;
text-shadow: 0 0 5px #0f0,0 0 10px #0f0;
transition: all 0.3s ease;
}
</style>

</head>  
<body>  <canvas id="matrix"></canvas>

<div id="loadingScreen" class="screen" style="display:flex;">  
  <h1>Initializing Quiz...</h1>  
  <div class="loader"></div>  
</div>  <div id="homeScreen" class="screen">  
  <h1>QUIZ WEB STUDENT</h1>  
  <button onclick="startQuiz()">Start Quiz</button>  
  <button onclick="showInstructions()">Instructions</button>  
</div>  <div id="quizScreen" class="screen">  
  <div id="questionCard">  
    <h2>Question <span id="qNumber"></span>/10</h2>  
    <p id="questionText"></p>  
    <div id="optionsContainer"></div>  
    <h3>Score: <span id="score">0</span></h3>  
  </div>  
</div>  <script>  
  
const canvas=document.getElementById('matrix');  
const ctx=canvas.getContext('2d');  
let w,h;  
function resizeCanvas(){ w=canvas.width=window.innerWidth; h=canvas.height=window.innerHeight; }  
window.addEventListener('resize',resizeCanvas);  
resizeCanvas();  
  
const cols=Math.floor(w/20)+1;  
const ypos=Array(cols).fill(0);  
  
function matrixLoop(){  
  ctx.fillStyle='rgba(0,0,0,0.05)';  
  ctx.fillRect(0,0,w,h);  
  ctx.fillStyle='#0f0';  
  ctx.font='15px monospace';  
  for(let i=0;i<cols;i++){  
    const text=String.fromCharCode(0x30A0 + Math.random()*96);  
    ctx.fillText(text,i*20,ypos[i]*20);  
    if(ypos[i]*20>h && Math.random()>0.975) ypos[i]=0;  
    ypos[i]++;  
  }  
  requestAnimationFrame(matrixLoop);  
}  
matrixLoop();  
  
  
function showScreen(id){ document.querySelectorAll('.screen').forEach(s=>s.style.display='none'); document.getElementById(id).style.display='flex'; }  
  
  
setTimeout(()=>showScreen('homeScreen'),3000);  
  
  
function startQuiz(){   
  showScreen('quizScreen');   
  initQuiz();  
}  
function showInstructions(){  
  alert("Answer 10 random questions about web development (HTML, CSS, JS). Click an option to answer. Score increases for correct answers.");  
}  
  
  
const questions = [  
  { q:"HTML stands for?", options:["Hyper Text Markup Language","Home Tool Markup Language","Hyperlinks Text Mark Language","Hyperlinking Text Markup Language"], answer:0 },  
  { q:"Which HTML tag is used for a line break?", options:["<br>","<break>","<lb>","<line>"], answer:0 },  
  { q:"CSS stands for?", options:["Cascading Style Sheets","Computer Style Sheets","Creative Style Syntax","Colorful Style Sheets"], answer:0 },  
  { q:"Which property changes text color in CSS?", options:["color","font-color","text-color","fgcolor"], answer:0 },  
  { q:"JavaScript is used for?", options:["Making web pages interactive","Styling web pages","Structuring content","Database management"], answer:0 },  
  { q:"Which symbol is used for comments in JS?", options:["//","/* */","#","<!-- -->"], answer:0 },  
  { q:"How to include an external CSS file?", options:["<link rel='stylesheet' href='style.css'>","<script src='style.css'>","<css src='style.css'>","<style src='style.css'>"], answer:0 },  
  { q:"Which method prints messages to the console in JS?", options:["console.log()","print()","alert()","document.write()"], answer:0 },  
  { q:"The correct HTML element for the largest heading is?", options:["<h1>","<h6>","<head>","<header>"], answer:0 },  
  { q:"Which CSS property controls layout?", options:["display","layout","positioning","flow"], answer:0 }  
];  
  
  
let shuffledQuestions=[], currentQ=0, score=0;  
  
function initQuiz(){  
  shuffledQuestions = questions.sort(()=>0.5-Math.random()).slice(0,10);  
  currentQ=0;  
  score=0;  
  showQuestion();  
}  
  
function showQuestion(){  
  const qObj = shuffledQuestions[currentQ];  
  document.getElementById('qNumber').textContent=currentQ+1;  
    
  const questionText = document.getElementById('questionText');  
  questionText.textContent='';  
  typeText(qObj.q,questionText);  
  
  const optionsContainer = document.getElementById('optionsContainer');  
  optionsContainer.innerHTML='';  
  qObj.options.forEach((opt,i)=>{  
    const btn = document.createElement('button');  
    btn.className='option';  
    btn.textContent=opt;  
    btn.onclick=()=>checkAnswer(i);  
    optionsContainer.appendChild(btn);  
  });  
}  
  
  
function typeText(text,el){  
  let i=0;  
  const interval = setInterval(()=>{  
    el.textContent+=text[i];  
    i++;  
    if(i>=text.length) clearInterval(interval);  
  },20);  
}  
  
function checkAnswer(selected){  
  if(selected===shuffledQuestions[currentQ].answer){  
    score+=10;  
  
    const scoreEl=document.getElementById('score');  
    scoreEl.style.textShadow='0 0 20px #0f0,0 0 30px #0f0';  
    setTimeout(()=>scoreEl.style.textShadow='0 0 5px #0f0,0 0 10px #0f0',300);  
  }  
  document.getElementById('score').textContent=score;  
  currentQ++;  
  if(currentQ<shuffledQuestions.length) showQuestion();  
  else{ alert("Quiz finished! Your score: "+score); showScreen('homeScreen'); }  
}  
</script>  </body>  
</html>
